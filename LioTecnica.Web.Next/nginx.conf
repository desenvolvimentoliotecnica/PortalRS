server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos com cache longo (JS, CSS, imagens com hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Integração RM (consultas SQL Server / REST podem levar > 60s)
    location /api/rm/ {
        proxy_pass         http://api/api/rm/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # Proxy reverso para a API C# (serviço 'api' no docker-compose, porta 80)
    location /api/ {
        proxy_pass         http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Proxy para hubs SignalR
    location /hubs/ {
        proxy_pass         http://api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # /bff/* removido na Fase 13 — o Portal MVC foi descomissionado e tudo
    # que vivia no BFF virou endpoint REST em /api/... na RHPortal.Api.

    # Entrada amigável do portal: evita o redirect automático do nginx de
    # /app para /app/ (que pode perder a porta publicada do container).
    location = /app {
        return 302 /app/login;
    }

    # SPA fallback: qualquer rota sob /app/ serve o index.html do Next.js
    location /app/ {
        try_files $uri $uri.html $uri/ /app/index.html;
    }

    # Redireciona / para /app/
    location = / {
        return 301 /app/;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
