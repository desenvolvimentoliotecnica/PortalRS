server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos com cache longo (JS, CSS, imagens com hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota sob /app/ serve o index.html do Next.js
    location /app/ {
        try_files $uri $uri.html $uri/ /app/index.html;
    }

    # Redireciona / para /app/
    location = / {
        return 301 /app/;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
