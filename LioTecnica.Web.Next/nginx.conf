server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # DNS embebido do Docker — hostname "api" via variável (resolve em runtime, não no boot)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos com cache longo (JS, CSS, imagens com hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Integração RM (consultas SQL Server / REST podem levar > 60s)
    location /api/rm/ {
        proxy_pass         http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Proxy reverso para a API C# (serviço 'api' no docker-compose, porta 80)
    location /api/ {
        proxy_pass         http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Proxy para hubs SignalR
    location /hubs/ {
        proxy_pass         http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # /bff/* removido na Fase 13 — o Portal MVC foi descomissionado e tudo
    # que vivia no BFF virou endpoint REST em /api/... na RHPortal.Api.

    # Entrada amigável do portal: evita o redirect automático do nginx de
    # /app para /app/ (que pode perder a porta publicada do container).
    location = /app {
        return 302 /app/login;
    }

    # URL legada (pasta __analise__ no repositório) → rota publicada no export
    location /app/__analise__/mockups-mvc/ {
        return 302 /app/mockups-mobile/;
    }

    # Protótipo HTML mobile — arquivos estáticos, sem fallback SPA
    location ^~ /app/mockups-mobile/ {
        try_files $uri $uri/ =404;
    }

    # SPA fallback: qualquer rota sob /app/ serve o index.html do Next.js
    location /app/ {
        try_files $uri $uri.html $uri/ /app/index.html;
    }

    # Redireciona / para /app/
    location = / {
        return 301 /app/;
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
