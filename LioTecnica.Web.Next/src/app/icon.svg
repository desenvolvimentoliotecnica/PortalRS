<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g" x1="3" y1="3" x2="37" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4f8ef7"/>
      <stop offset="55%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0d2657"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo circular com gradiente -->
  <circle cx="20" cy="20" r="19.5" fill="url(#g)"/>
  <circle cx="20" cy="20" r="18.8" fill="none" stroke="white" stroke-width="0.6" stroke-opacity="0.12"/>

  <!-- R monoline dinâmico com perna curva -->
  <path
    d="M 12 31 L 12 9 L 22 9 A 5.5 5.5 0 0 1 22 20 L 12 20 M 17 20 Q 23 26 29 31"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Accent arc -->
  <path d="M 30 8 A 5 5 0 0 1 35 13" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
</svg>
