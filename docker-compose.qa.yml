services:
  api:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/render-api:${IMAGE_TAG}"
    container_name: voltage-renderrh-api
    restart: unless-stopped
    ports:
      - "5000:80"
    env_file:
      - .env.qa
    environment:
      - Cors__AllowAny=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web-next:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/render-web-next:${IMAGE_TAG}"
    container_name: voltage-renderrh-web-next
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  ai:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/render-ai:${IMAGE_TAG}"
    container_name: voltage-renderrh-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.qa
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
