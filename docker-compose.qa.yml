services:
  api:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:api-${IMAGE_TAG}"
    container_name: voltage-renderrh-api
    restart: unless-stopped
    ports:
      - "5000:80"
    env_file:
      - .env.qa
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:web-${IMAGE_TAG}"
    container_name: voltage-renderrh-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    env_file:
      - .env.qa

  ai:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:ai-${IMAGE_TAG}"
    container_name: voltage-renderrh-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.qa
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  integration:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:integration-${IMAGE_TAG}"
    container_name: voltage-renderrh-integration
    restart: unless-stopped
    env_file:
      - .env.qa
