<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Talent RH — Banco de talentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #005691;
      --primary-dark: #004578;
      --primary-soft: #e8f2fa;
      --teal: #0d9488;
      --teal-soft: #e6f5f3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2b3c;
      --muted: #6c7a89;
      --muted-light: #9aa5b1;
      --border: #e8ecf0;
      --green: #1a9e5c;
      --green-soft: #e6f7ee;
      --orange: #e67e22;
      --orange-soft: #fef3e6;
      --purple: #7c3aed;
      --purple-soft: #f0e8fd;
      --pink: #db2777;
      --pink-soft: #fce7f3;
      --blue: #2b7fd4;
      --blue-soft: #e3f0fb;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0, 40, 80, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bottom-nav-h: 64px;
      --fab-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .status-icons .signal { letter-spacing: 1px; font-size: 11px; }
    .battery {
      width: 24px;
      height: 11px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 2px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: var(--text);
      border-radius: 0 1px 1px 0;
    }
    .battery .level {
      position: absolute;
      inset: 1.5px;
      right: 30%;
      background: var(--text);
      border-radius: 1px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      background: var(--card);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-icon {
      position: relative;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-icon:active { background: var(--primary-soft); }
    .badge-count {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #e53935;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-header {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .page-header {
      padding: 4.12px 16px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .page-header-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .btn-back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--primary);
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      text-decoration: none;
    }
    .btn-back:active { background: var(--primary-soft); }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .page-subtitle {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Search & filters */
    .search-section {
      padding: 12px 16px 0;
      background: var(--card);
    }
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-light);
      font-size: 14px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: var(--muted-light); }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 86, 145, 0.1);
      background: var(--card);
    }

    .filters-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .filter-chip:active { opacity: 0.85; }
    .filter-more {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .filter-more:active { background: var(--bg); }

    /* KPI strip */
    .kpi-strip {
      display: flex;
      gap: 8px;
      padding: 0 16px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .kpi-strip::-webkit-scrollbar { display: none; }
    .kpi-card {
      flex: 1;
      min-width: 108px;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .kpi-card.blue { background: linear-gradient(180deg, #f8fbff 0%, var(--card) 100%); }
    .kpi-card.purple { background: linear-gradient(180deg, #faf8ff 0%, var(--card) 100%); }
    .kpi-card.green { background: linear-gradient(180deg, #f6fcf9 0%, var(--card) 100%); }
    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .kpi-card.blue .kpi-icon { background: var(--blue-soft); color: var(--blue); }
    .kpi-card.purple .kpi-icon { background: var(--purple-soft); color: var(--purple); }
    .kpi-card.green .kpi-icon { background: var(--green-soft); color: var(--green); }
    .kpi-label {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi-card.blue .kpi-value { color: var(--blue); }
    .kpi-card.purple .kpi-value { color: var(--purple); }
    .kpi-card.green .kpi-value { color: var(--green); }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      padding-bottom: calc(var(--bottom-nav-h) + var(--fab-h) + 24px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .candidate-list { display: flex; flex-direction: column; gap: 10px; }

    .candidate-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 14px;
      cursor: pointer;
      transition: transform 0.1s;
      position: relative;
    }
    .candidate-card:active { transform: scale(0.99); }
    .candidate-card.hidden { display: none; }

    .candidate-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: flex-start;
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .candidate-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--card);
    }
    .status-dot.green { background: var(--green); }
    .status-dot.orange { background: var(--orange); }
    .status-dot.pink { background: var(--pink); }

    .candidate-info { min-width: 0; }
    .candidate-name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .candidate-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }
    .status-badge {
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-badge.available { background: var(--green-soft); color: var(--green); }
    .status-badge.process { background: var(--orange-soft); color: var(--orange); }
    .status-badge.hot { background: var(--pink-soft); color: var(--pink); }

    .candidate-role {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .candidate-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: var(--muted-light);
    }
    .candidate-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .candidate-meta i { font-size: 10px; }

    /* Match ring */
    .match-ring {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .match-ring svg {
      width: 44px;
      height: 44px;
      transform: rotate(-90deg);
    }
    .match-ring .track { fill: none; stroke: var(--border); stroke-width: 3; }
    .match-ring .progress { fill: none; stroke-width: 3; stroke-linecap: round; }
    .match-ring .progress.green { stroke: var(--green); }
    .match-ring .progress.orange { stroke: var(--orange); }
    .match-ring .progress.pink { stroke: var(--pink); }
    .match-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .skill-tag {
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
    }

    .candidate-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .last-contact {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted-light);
    }
    .last-contact i { font-size: 10px; }
    .candidate-chevron {
      color: var(--muted-light);
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }
    .empty-state.show { display: block; }

    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + 12px + var(--safe-bottom));
      right: 50%;
      transform: translateX(calc(215px - 50%));
      max-width: calc(430px - 32px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 26px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 86, 145, 0.35);
      z-index: 15;
      white-space: nowrap;
    }
    .fab i {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .fab:active { transform: translateX(calc(215px - 50%)) scale(0.97); }

    @media (max-width: 430px) {
      .fab {
        right: 16px;
        transform: none;
      }
      .fab:active { transform: scale(0.97); }
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--bottom-nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted-light);
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 56px;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
    }
    .nav-item:active { opacity: 0.7; }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26, 43, 60, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (min-width: 431px) {
      body { padding: 20px 0; align-items: flex-start; }
      .phone { min-height: calc(100dvh - 40px); border-radius: 24px; overflow: hidden; }
    }
  </style>
</head>
<body>
  <div class="phone" id="app">
    <div class="status-bar" aria-hidden="true">
      <span id="statusTime">9:41</span>
      <div class="status-icons">
        <span class="signal">●●●●</span>
        <i class="fa-solid fa-wifi"></i>
        <div class="battery"><div class="level"></div></div>
      </div>
    </div>

    <header class="app-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" fill="#005691"/>
          <path d="M12 10H20V12H17V22H15V12H12V10Z" fill="white"/>
        </svg>
        <span class="brand-name">Talent RH</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnNotifications" aria-label="Notificações">
          <i class="fa-regular fa-bell"></i>
          <span class="badge-count">8</span>
        </button>
        <img class="avatar-header" src="https://i.pravatar.cc/80?img=32" alt="Usuário" />
      </div>
    </header>

    <div class="page-header">
      <div class="page-header-top">
        <a href="dashboard-mobile.html" class="btn-back" aria-label="Voltar">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="page-title">Banco de talentos</h1>
          <p class="page-subtitle">Encontre candidatos já mapeados para vagas atuais e futuras.</p>
        </div>
      </div>
    </div>

    <div class="search-section">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="search"
          class="search-input"
          id="searchInput"
          placeholder="Buscar por nome, cargo, habilidade ou cidade..."
          autocomplete="off"
        />
      </div>
      <div class="filters-row" id="filtersRow"></div>
    </div>

    <div class="kpi-strip" id="kpiStrip"></div>

    <main class="content">
      <div class="candidate-list" id="candidateList"></div>
      <div class="empty-state" id="emptyState">
        <i class="fa-solid fa-user-slash" style="font-size:32px;margin-bottom:12px;opacity:.4"></i>
        <p>Nenhum talento encontrado para esta busca.</p>
      </div>
    </main>

    <button type="button" class="fab" id="btnFab">
      <i class="fa-solid fa-plus"></i>
      Novo talento
    </button>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="dashboard-mobile.html" class="nav-item" data-nav="inicio">
        <i class="fa-solid fa-house"></i>
        <span>Início</span>
      </a>
      <a href="detalhe-requisicao-mobile.html" class="nav-item" data-nav="requisicoes">
        <i class="fa-solid fa-clipboard-list"></i>
        <span>Requisições</span>
      </a>
      <a href="#" class="nav-item" data-nav="vagas">
        <i class="fa-solid fa-briefcase"></i>
        <span>Vagas</span>
      </a>
      <a href="#" class="nav-item active" data-nav="candidatos">
        <i class="fa-solid fa-user-group"></i>
        <span>Candidatos</span>
      </a>
      <a href="#" class="nav-item" data-nav="mais">
        <i class="fa-solid fa-ellipsis"></i>
        <span>Mais</span>
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const filters = [

        },
        {
          id: 3,
          avatar: 'https://i.pravatar.cc/96?img=5',

          role: 'Desenvolvedora Full Stack',
          city: 'Campinas/SP',
          years: '6 anos',
          status: 'hot',
          statusLabel: 'Banco quente',
          dot: 'pink',
          match: 95,
          matchColor: 'pink',
          skills: ['React', 'Node.js', 'PostgreSQL', '+3'],
          contact: 'Último contato: 1 dia',
          tags: ['disponiveis', 'match', 'ti']
        },
        {
          id: 4,
          avatar: 'https://i.pravatar.cc/96?img=25',
          name: 'Rafael Costa',
          role: 'Analista de TI Pleno',
          city: 'São Paulo/SP',
          years: '4 anos',
          status: 'available',
          statusLabel: 'Disponível',
          dot: 'green',
          match: 84,
          matchColor: 'green',
          skills: ['Infraestrutura', 'Azure', 'Suporte', '+1'],
          contact: 'Último contato: 5 dias',
          tags: ['disponiveis', 'ti']
        }
      ];

      let activeFilter = 'todos';
      let searchQuery = '';

      const $ = (sel) => document.querySelector(sel);
      const toast = $('#toast');
      let toastTimer;

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function matchRing(percent, color) {
        const r = 18;
        const c = 2 * Math.PI * r;
        const offset = c - (percent / 100) * c;
        return `
          <div class="match-ring" aria-label="Match ${percent}%">
            <svg viewBox="0 0 44 44">
              <circle class="track" cx="22" cy="22" r="${r}"/>
              <circle class="progress ${color}" cx="22" cy="22" r="${r}"
                stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
            </svg>
            <span class="match-value">${percent}%</span>
          </div>
        `;
      }

      function renderFilters() {
        $('#filtersRow').innerHTML = filters.map((f) => `
          <button type="button" class="filter-chip${f.id === activeFilter ? ' active' : ''}"
            data-filter="${f.id}">${escapeHtml(f.label)}</button>
        `).join('') + `
          <button type="button" class="filter-more" id="btnFilterMore" aria-label="Mais filtros">
            <i class="fa-solid fa-sliders"></i>
          </button>
        `;
      }

      function renderKpis() {
        $('#kpiStrip').innerHTML = kpis.map((k) => `
          <div class="kpi-card ${k.color}">
            <div class="kpi-icon"><i class="fa-solid ${k.icon}"></i></div>
            <div class="kpi-label">${escapeHtml(k.label)}</div>
            <div class="kpi-value">${k.value}</div>
          </div>
        `).join('');
      }

      function filterCandidates() {
        const q = searchQuery.toLowerCase().trim();
        return candidates.filter((c) => {
          const matchFilter =
            activeFilter === 'todos' ||
            (activeFilter === 'disponiveis' && c.tags.includes('disponiveis')) ||
            (activeFilter === 'match' && c.match >= 88) ||
            (activeFilter === 'rh' && c.tags.includes('rh')) ||
            (activeFilter === 'ti' && c.tags.includes('ti'));

          if (!matchFilter) return false;
          if (!q) return true;

          const haystack = [
            c.name, c.role, c.city, c.years,
            ...c.skills.filter((s) => !s.startsWith('+')),
            c.statusLabel
          ].join(' ').toLowerCase();

          return haystack.includes(q);
        });
      }

      function renderCandidates() {
        const list = filterCandidates();
        const container = $('#candidateList');
        const empty = $('#emptyState');

        container.innerHTML = list.map((c) => `
          <article class="candidate-card" data-id="${c.id}" data-name="${escapeHtml(c.name)}" data-route="rh-perfil">
            <div class="candidate-top">
              <div class="avatar-wrap">
                <img class="candidate-avatar" src="${c.avatar}" alt="${escapeHtml(c.name)}" />
                <span class="status-dot ${c.dot}"></span>
              </div>
              <div class="candidate-info">
                <div class="candidate-name-row">
                  <div class="candidate-name">${escapeHtml(c.name)}</div>
                  <span class="status-badge ${c.status}">${escapeHtml(c.statusLabel)}</span>
                </div>
                <div class="candidate-role">${escapeHtml(c.role)}</div>
                <div class="candidate-meta">
                  <span><i class="fa-solid fa-location-dot"></i>${escapeHtml(c.city)}</span>
                  <span><i class="fa-solid fa-briefcase"></i>${escapeHtml(c.years)}</span>
                </div>
              </div>
              ${matchRing(c.match, c.matchColor)}
            </div>
            <div class="skills-row">
              ${c.skills.map((s) => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}
            </div>
            <div class="candidate-footer">
              <div class="last-contact">
                <i class="fa-regular fa-clock"></i>
                <span>${escapeHtml(c.contact)}</span>
              </div>
              <i class="fa-solid fa-chevron-right candidate-chevron"></i>
            </div>
          </article>
        `).join('');

        empty.classList.toggle('show', list.length === 0);
      }

      function updateClock() {
        const now = new Date();
        $('#statusTime').textContent =
          `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      }

      function bindEvents() {
        $('#btnNotifications').addEventListener('click', () => showToast('8 notificações não lidas'));
        $('#btnFab').addEventListener('click', () => showToast('Cadastrar novo talento'));
        $('#btnFilterMore').addEventListener('click', () => showToast('Filtros avançados'));

        $('#filtersRow').addEventListener('click', (e) => {
          const chip = e.target.closest('.filter-chip');
          if (!chip) return;
          activeFilter = chip.dataset.filter;
          renderFilters();
          renderCandidates();
          bindFilterEvents();
        });

        $('#searchInput').addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderCandidates();
        });

        $('#candidateList').addEventListener('click', (e) => {
          const card = e.target.closest('.candidate-card');
          if (!card) return;
        });

      }

      function bindFilterEvents() {
        const btn = $('#btnFilterMore');
        if (btn) {
          btn.replaceWith(btn.cloneNode(true));
          $('#btnFilterMore').addEventListener('click', () => showToast('Filtros avançados'));
        }
      }

      renderFilters();
      renderKpis();
      renderCandidates();
      updateClock();
      bindEvents();
      setInterval(updateClock, 60000);
    })();
  </script>
  <script type="module">
    import { initPage } from './js/nav.js';
    initPage('rh-banco');
  </script>
</body>
</html>
