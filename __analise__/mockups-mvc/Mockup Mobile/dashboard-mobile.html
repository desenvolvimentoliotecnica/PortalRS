<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Talent RH — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #005691;
      --primary-dark: #004578;
      --primary-soft: #e8f2fa;
      --teal: #0d9488;
      --teal-soft: #e6f5f3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2b3c;
      --muted: #6c7a89;
      --muted-light: #9aa5b1;
      --border: #e8ecf0;
      --green: #1a9e5c;
      --green-soft: #e6f7ee;
      --orange: #e67e22;
      --orange-soft: #fef3e6;
      --purple: #7c3aed;
      --purple-soft: #f0e8fd;
      --blue: #2b7fd4;
      --blue-soft: #e3f0fb;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0, 40, 80, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bottom-nav-h: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .status-icons .signal { letter-spacing: 1px; font-size: 11px; }
    .battery {
      width: 24px;
      height: 11px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 2px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: var(--text);
      border-radius: 0 1px 1px 0;
    }
    .battery .level {
      position: absolute;
      inset: 1.5px;
      right: 30%;
      background: var(--text);
      border-radius: 1px;
    }

    /* App header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      background: var(--card);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-icon {
      position: relative;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-icon:active { background: var(--primary-soft); }
    .badge-count {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #e53935;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-header {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    /* Greeting */
    .greeting {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 16px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .greeting-text { flex: 1; min-width: 0; }
    .greeting-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .greeting-subtitle {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .date-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .date-chip i {
      color: var(--teal);
      font-size: 16px;
    }
    .date-chip-text { line-height: 1.25; }
    .date-chip-day {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .date-chip-weekday {
      font-size: 11px;
      color: var(--muted-light);
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(var(--bottom-nav-h) + 20px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .section { margin-bottom: 20px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .section-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
      text-decoration: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .section-link:active { opacity: 0.7; }
    .section-link i { font-size: 10px; }

    /* Metric cards 2x2 */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .metric-card:active { transform: scale(0.98); }
    .metric-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .metric-card.orange .metric-icon { background: var(--orange-soft); color: var(--orange); }
    .metric-card.purple .metric-icon { background: var(--purple-soft); color: var(--purple); }
    .metric-card.green .metric-icon { background: var(--green-soft); color: var(--green); }
    .metric-card.blue .metric-icon { background: var(--blue-soft); color: var(--blue); }
    .metric-label {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;
    }
    .metric-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    /* Funnel */
    .funnel-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 12px;
    }
    .funnel-flow {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
    }
    .funnel-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .funnel-stage:not(:last-child)::after {
      content: '\f054';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: -6px;
      top: 14px;
      font-size: 8px;
      color: var(--muted-light);
      z-index: 2;
    }
    .funnel-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .funnel-stage.blue .funnel-circle { background: var(--blue-soft); color: var(--blue); }
    .funnel-stage.teal .funnel-circle { background: var(--teal-soft); color: var(--teal); }
    .funnel-stage.orange .funnel-circle { background: var(--orange-soft); color: var(--orange); }
    .funnel-stage.green .funnel-circle { background: var(--green-soft); color: var(--green); }
    .funnel-label {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2px;
      line-height: 1.2;
    }
    .funnel-count {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .funnel-line {
      position: absolute;
      top: 22px;
      left: 12%;
      right: 12%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }

    /* Interview cards */
    .interview-list { display: flex; flex-direction: column; gap: 10px; }
    .interview-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }
    .interview-card:active { opacity: 0.92; }
    .interview-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .interview-cal {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .interview-card.blue .interview-cal { background: var(--blue-soft); color: var(--blue); }
    .interview-card.purple .interview-cal { background: var(--purple-soft); color: var(--purple); }
    .interview-card.green .interview-cal { background: var(--green-soft); color: var(--green); }
    .interview-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .interview-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .interview-role {
      font-size: 11.5px;
      color: var(--muted-light);
      margin-top: 1px;
    }
    .interview-datetime {
      text-align: right;
    }
    .interview-date-row,
    .interview-time-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 11px;
      color: var(--muted-light);
    }
    .interview-date-row { margin-bottom: 2px; }
    .interview-date-row i,
    .interview-time-row i { font-size: 10px; }
    .interview-interviewer {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    .interview-interviewer-label {
      font-size: 10px;
      color: var(--muted-light);
    }
    .interview-interviewer-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
    }

    /* Pendências */
    .pending-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .pending-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pending-row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .pending-row:active { background: var(--bg); }
    .pending-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .pending-row.orange .pending-icon { background: var(--orange-soft); color: var(--orange); }
    .pending-row.purple .pending-icon { background: var(--purple-soft); color: var(--purple); }
    .pending-row.green .pending-icon { background: var(--green-soft); color: var(--green); }
    .pending-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }
    .pending-chevron {
      color: var(--muted-light);
      font-size: 12px;
    }

    /* Quick actions */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 6px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .action-btn.teal .action-icon { background: var(--teal-soft); color: var(--teal); }
    .action-btn.purple .action-icon { background: var(--purple-soft); color: var(--purple); }
    .action-btn.blue .action-icon { background: var(--blue-soft); color: var(--blue); }
    .action-btn.orange .action-icon { background: var(--orange-soft); color: var(--orange); }
    .action-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      line-height: 1.25;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--bottom-nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted-light);
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 56px;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active {
      color: var(--teal);
      background: var(--teal-soft);
    }
    .nav-item:active { opacity: 0.7; }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26, 43, 60, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (min-width: 431px) {
      body { padding: 20px 0; align-items: flex-start; }
      .phone { min-height: calc(100dvh - 40px); border-radius: 24px; overflow: hidden; }
    }

    @media (max-width: 360px) {
      .actions-grid { grid-template-columns: repeat(2, 1fr); }
      .funnel-label { font-size: 9px; }
      .funnel-circle { width: 38px; height: 38px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="phone" id="app">
    <div class="status-bar" aria-hidden="true">
      <span id="statusTime">9:41</span>
      <div class="status-icons">
        <span class="signal">●●●●</span>
        <i class="fa-solid fa-wifi"></i>
        <div class="battery"><div class="level"></div></div>
      </div>
    </div>

    <header class="app-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" fill="#005691"/>
          <path d="M12 10H20V12H17V22H15V12H12V10Z" fill="white"/>
        </svg>
        <span class="brand-name">Talent RH</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnNotifications" aria-label="Notificações">
          <i class="fa-regular fa-bell"></i>
          <span class="badge-count">8</span>
        </button>
        <img class="avatar-header" src="https://i.pravatar.cc/80?img=32" alt="Carolina" />
      </div>
    </header>

    <div class="greeting">
      <div class="greeting-text">
        <h1 class="greeting-title" id="greetingTitle">Olá, Carolina</h1>
        <p class="greeting-subtitle">Veja o panorama do recrutamento hoje.</p>
      </div>
      <div class="date-chip">
        <i class="fa-regular fa-calendar"></i>
        <div class="date-chip-text">
          <div class="date-chip-day" id="dateDisplay">20/05/2024</div>
          <div class="date-chip-weekday" id="weekdayDisplay">Segunda-feira</div>
        </div>
      </div>
    </div>

    <main class="content">
      <!-- Dashboard RH -->
      <section class="section" aria-labelledby="dash-title">
        <div class="section-header">
          <h2 class="section-title" id="dash-title">Dashboard RH</h2>
        </div>
        <div class="metrics-grid" id="metricsGrid"></div>
      </section>

      <!-- Funil -->
      <section class="section" aria-labelledby="funnel-title">
        <div class="section-header">
          <h2 class="section-title" id="funnel-title">Funil de recrutamento</h2>
          <a href="#" class="section-link" data-action="Ver funil completo">
            Ver funil completo <i class="fa-solid fa-chevron-right"></i>
          </a>
        </div>
        <div class="funnel-card">
          <div class="funnel-line" aria-hidden="true"></div>
          <div class="funnel-flow" id="funnelFlow"></div>
        </div>
      </section>

      <!-- Entrevistas -->
      <section class="section" aria-labelledby="interviews-title">
        <div class="section-header">
          <h2 class="section-title" id="interviews-title">Entrevistas da semana</h2>
          <a href="#" class="section-link" data-route="rh-agenda" data-action="Ver agenda">
            Ver agenda <i class="fa-solid fa-chevron-right"></i>
          </a>
        </div>
        <div class="interview-list" id="interviewList"></div>
      </section>

      <!-- Pendências -->
      <section class="section" aria-labelledby="pending-title">
        <div class="section-header">
          <h2 class="section-title" id="pending-title">Pendências do time</h2>
        </div>
        <div class="pending-card" id="pendingList"></div>
      </section>

      <!-- Ações rápidas -->
      <section class="section" aria-labelledby="actions-title">
        <div class="section-header">
          <h2 class="section-title" id="actions-title">Ações rápidas</h2>
        </div>
        <div class="actions-grid" id="actionsGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#" class="nav-item active" data-nav="inicio">
        <i class="fa-solid fa-house"></i>
        <span>Início</span>
      </a>
      <a href="detalhe-requisicao-mobile.html" class="nav-item" data-nav="requisicoes">
        <i class="fa-solid fa-clipboard-list"></i>
        <span>Requisições</span>
      </a>
      <a href="#" class="nav-item" data-nav="vagas">
        <i class="fa-solid fa-briefcase"></i>
        <span>Vagas</span>
      </a>
      <a href="#" class="nav-item" data-nav="candidatos">
        <i class="fa-solid fa-user-group"></i>
        <span>Candidatos</span>
      </a>
      <a href="#" class="nav-item" data-nav="mais">
        <i class="fa-solid fa-ellipsis"></i>
        <span>Mais</span>
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const metrics = [
        { color: 'orange', icon: 'fa-clipboard-list', label: 'Requisições recebidas', value: 24 },
        { color: 'purple', icon: 'fa-user-plus', label: 'Vagas em criação', value: 12 },
        { color: 'green', icon: 'fa-paper-plane', label: 'Vagas publicadas', value: 8 },
        { color: 'blue', icon: 'fa-user', label: 'Candidatos novos', value: 36 }
      ];

      const funnel = [
        { color: 'blue', icon: 'fa-filter', label: 'Triagem', count: 18 },
        { color: 'teal', icon: 'fa-users', label: 'Entrevistas', count: 9 },
        { color: 'orange', icon: 'fa-clipboard-check', label: 'Teste', count: 4 },
        { color: 'green', icon: 'fa-handshake', label: 'Proposta', count: 2 }
      ];

      const interviews = [
        {
          color: 'blue',
          avatar: 'https://i.pravatar.cc/80?img=47',
          name: 'Juliana Alves',
          role: 'Analista de RH',
          dateLabel: 'Hoje, 20/05',
          time: '14:00',
          interviewer: 'Mariana Costa'
        },
        {
          color: 'purple',
          avatar: 'https://i.pravatar.cc/80?img=12',
          name: 'Bruno Martins',
          role: 'Assistente de Produção',
          dateLabel: 'Amanhã, 21/05',
          time: '10:30',
          interviewer: 'Carlos Mendes'
        },
        {
          color: 'green',
          avatar: 'https://i.pravatar.cc/80?img=5',
          name: 'Beatriz Lima',
          role: 'Analista de RH Pleno',
          dateLabel: 'Qua, 22/05',
          time: '16:00',
          interviewer: 'Mariana Costa'
        }
      ];

      const pending = [
        { color: 'orange', icon: 'fa-clock', text: '3 requisições aguardando triagem' },
        { color: 'purple', icon: 'fa-paper-plane', text: '2 vagas prontas para publicar' },
        { color: 'green', icon: 'fa-user-check', text: '1 parecer pendente do gestor' }
      ];

      const quickActions = [
        { color: 'teal', icon: 'fa-circle-plus', label: 'Nova vaga', route: 'rh-vagas' },
        { color: 'purple', icon: 'fa-users-viewfinder', label: 'Banco de talentos', route: 'rh-banco' },
        { color: 'blue', icon: 'fa-calendar-days', label: 'Entrevistas', route: 'rh-agenda' },
        { color: 'orange', icon: 'fa-chart-column', label: 'Relatórios', route: 'rh-relatorios' }
      ];

      const weekdays = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

      const $ = (sel) => document.querySelector(sel);
      const toast = $('#toast');
      let toastTimer;

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderMetrics() {
        $('#metricsGrid').innerHTML = metrics.map((m) => `
          <div class="metric-card ${m.color}" data-metric="${escapeHtml(m.label)}">
            <div class="metric-icon"><i class="fa-solid ${m.icon}"></i></div>
            <div class="metric-label">${escapeHtml(m.label)}</div>
            <div class="metric-value">${m.value}</div>
          </div>
        `).join('');
      }

      function renderFunnel() {
        $('#funnelFlow').innerHTML = funnel.map((s) => `
          <div class="funnel-stage ${s.color}">
            <div class="funnel-circle"><i class="fa-solid ${s.icon}"></i></div>
            <div class="funnel-label">${escapeHtml(s.label)}</div>
            <div class="funnel-count">${s.count}</div>
          </div>
        `).join('');
      }

      function renderInterviews() {
        $('#interviewList').innerHTML = interviews.map((iv) => `
          <article class="interview-card ${iv.color}" data-interview="${escapeHtml(iv.name)}">
            <div class="interview-left">
              <div class="interview-cal"><i class="fa-regular fa-calendar"></i></div>
              <img class="interview-avatar" src="${iv.avatar}" alt="${escapeHtml(iv.name)}" />
            </div>
            <div>
              <div class="interview-name">${escapeHtml(iv.name)}</div>
              <div class="interview-role">${escapeHtml(iv.role)}</div>
            </div>
            <div class="interview-datetime">
              <div class="interview-date-row">
                <i class="fa-regular fa-calendar"></i>
                <span>${escapeHtml(iv.dateLabel)}</span>
              </div>
              <div class="interview-time-row">
                <i class="fa-regular fa-clock"></i>
                <span>${escapeHtml(iv.time)}</span>
              </div>
            </div>
            <div class="interview-interviewer">
              <span class="interview-interviewer-label">Entrevistador</span>
              <span class="interview-interviewer-name">${escapeHtml(iv.interviewer)}</span>
            </div>
          </article>
        `).join('');
      }

      function renderPending() {
        $('#pendingList').innerHTML = pending.map((p) => `
          <div class="pending-row ${p.color}" data-pending="${escapeHtml(p.text)}">
            <div class="pending-icon"><i class="fa-solid ${p.icon}"></i></div>
            <div class="pending-text">${escapeHtml(p.text)}</div>
            <i class="fa-solid fa-chevron-right pending-chevron"></i>
          </div>
        `).join('');
      }

      function renderActions() {
        $('#actionsGrid').innerHTML = quickActions.map((a) => `
          <button type="button" class="action-btn ${a.color}" data-action="${escapeHtml(a.label)}" data-route="${a.route}">
            <div class="action-icon"><i class="fa-solid ${a.icon}"></i></div>
            <span class="action-label">${escapeHtml(a.label)}</span>
          </button>
        `).join('');
      }

      function updateClock() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        $('#statusTime').textContent = `${h}:${m}`;

        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        $('#dateDisplay').textContent = `${day}/${month}/${year}`;
        $('#weekdayDisplay').textContent = weekdays[now.getDay()];
      }

      function bindEvents() {
        $('#btnNotifications').addEventListener('click', () => showToast('8 notificações não lidas'));

        document.querySelectorAll('.section-link:not([data-route])').forEach((link) => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            showToast(link.dataset.action);
          });
        });

        document.querySelectorAll('.metric-card').forEach((card) => {
          card.addEventListener('click', () => showToast(card.dataset.metric));
        });

        document.querySelectorAll('.interview-card').forEach((card) => {
          card.dataset.route = 'rh-agenda';
        });

        document.querySelectorAll('.pending-row').forEach((row) => {
          row.addEventListener('click', () => showToast(row.dataset.pending));
        });

      }

      renderMetrics();
      renderFunnel();
      renderInterviews();
      renderPending();
      renderActions();
      updateClock();
      bindEvents();
      setInterval(updateClock, 60000);
    })();
  </script>
  <script type="module">
    import { initPage } from './js/nav.js';
    initPage('rh-dashboard');
  </script>
</body>
</html>
