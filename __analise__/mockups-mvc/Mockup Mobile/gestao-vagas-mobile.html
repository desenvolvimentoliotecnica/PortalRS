<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Talent RH — Gestão de vagas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #005691;
      --primary-dark: #004578;
      --primary-soft: #e8f2fa;
      --teal: #0d9488;
      --teal-soft: #e6f5f3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2b3c;
      --muted: #6c7a89;
      --muted-light: #9aa5b1;
      --border: #e8ecf0;
      --green: #1a9e5c;
      --green-soft: #e6f7ee;
      --orange: #e67e22;
      --orange-soft: #fef3e6;
      --purple: #7c3aed;
      --purple-soft: #f0e8fd;
      --blue: #2b7fd4;
      --blue-soft: #e3f0fb;
      --grey: #6b7280;
      --grey-soft: #f3f4f6;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0, 40, 80, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bottom-nav-h: 64px;
      --cta-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .status-icons .signal { letter-spacing: 1px; font-size: 11px; }
    .battery {
      width: 24px;
      height: 11px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 2px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: var(--text);
      border-radius: 0 1px 1px 0;
    }
    .battery .level {
      position: absolute;
      inset: 1.5px;
      right: 30%;
      background: var(--text);
      border-radius: 1px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      background: var(--card);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-icon {
      position: relative;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-icon:active { background: var(--primary-soft); }
    .badge-count {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #e53935;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-header {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .greeting {
      padding: 4px 16px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .greeting-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .greeting-subtitle {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    .search-section {
      padding: 12px 16px 0;
      background: var(--card);
    }
    .search-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-light);
      font-size: 14px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: var(--muted-light); }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 86, 145, 0.1);
      background: var(--card);
    }
    .btn-filters {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-filters i { color: var(--primary); font-size: 13px; }
    .btn-filters:active { background: var(--bg); }

    .filters-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      font-weight: 600;
    }
    .filter-chip:active { opacity: 0.85; }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 16px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .kpi-card {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .kpi-card.blue { background: linear-gradient(180deg, #f8fbff 0%, var(--card) 100%); }
    .kpi-card.green { background: linear-gradient(180deg, #f6fcf9 0%, var(--card) 100%); }
    .kpi-card.orange { background: linear-gradient(180deg, #fffaf5 0%, var(--card) 100%); }
    .kpi-card.purple { background: linear-gradient(180deg, #faf8ff 0%, var(--card) 100%); }
    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .kpi-card.blue .kpi-icon { background: var(--blue-soft); color: var(--blue); }
    .kpi-card.green .kpi-icon { background: var(--green-soft); color: var(--green); }
    .kpi-card.orange .kpi-icon { background: var(--orange-soft); color: var(--orange); }
    .kpi-card.purple .kpi-icon { background: var(--purple-soft); color: var(--purple); }
    .kpi-label {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi-card.blue .kpi-value { color: var(--blue); }
    .kpi-card.green .kpi-value { color: var(--green); }
    .kpi-card.orange .kpi-value { color: var(--orange); }
    .kpi-card.purple .kpi-value { color: var(--purple); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      padding-bottom: calc(var(--bottom-nav-h) + var(--cta-h) + 28px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .vacancy-list { display: flex; flex-direction: column; gap: 10px; }

    .vacancy-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 14px;
      transition: transform 0.1s;
    }
    .vacancy-card.hidden { display: none; }

    .vacancy-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .vacancy-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }
    .status-badge {
      flex-shrink: 0;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-badge.rascunho { background: var(--purple-soft); color: var(--purple); }
    .status-badge.publicada { background: var(--green-soft); color: var(--green); }
    .status-badge.pausada { background: var(--orange-soft); color: var(--orange); }
    .status-badge.encerrada { background: var(--grey-soft); color: var(--grey); }
    .status-badge.aprovacao { background: #fff4e6; color: #d97706; }
    .status-badge.preenchida { background: var(--green-soft); color: var(--green); }

    .vacancy-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .vacancy-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .vacancy-meta i { font-size: 10px; color: var(--muted-light); }

    .vacancy-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      color: var(--muted-light);
      margin-bottom: 12px;
    }
    .vacancy-stats span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .vacancy-stats i { font-size: 10px; }

    .vacancy-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card);
      color: var(--primary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      min-width: 0;
    }
    .action-btn i { font-size: 12px; }
    .action-btn:active { background: var(--primary-soft); }
    .action-btn.more {
      flex: 0 0 40px;
      padding: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }
    .empty-state.show { display: block; }

    .cta-bar {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(244, 246, 248, 0) 0%, var(--bg) 30%);
      z-index: 15;
    }
    .btn-nova-vaga {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.35);
    }
    .btn-nova-vaga i {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .btn-nova-vaga:active { transform: scale(0.98); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--bottom-nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted-light);
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 56px;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
    }
    .nav-item:active { opacity: 0.7; }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26, 43, 60, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (min-width: 431px) {
      body { padding: 20px 0; align-items: flex-start; }
      .phone { min-height: calc(100dvh - 40px); border-radius: 24px; overflow: hidden; }
    }
  </style>
</head>

        <span>Candidatos</span>
      </a>
      <a href="#" class="nav-item" data-nav="mais">
        <i class="fa-solid fa-ellipsis"></i>
        <span>Mais</span>
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

          modality: 'Híbrido',
          modalityIcon: 'fa-building-circle-check',
          updated: 'Em aprovação há 2 dias',
          candidates: '6 candidatos',
          actions: [
            { id: 'view', icon: 'fa-eye', label: 'Ver' },
            { id: 'duplicate', icon: 'fa-copy', label: 'Duplicar' }
          ]
        },
        {
          id: 6,
          title: 'Coordenador Comercial',
          status: 'preenchida',
          statusLabel: 'Preenchida',
          department: 'Comercial',
          location: 'Belo Horizonte - MG',
          modality: 'Híbrido',
          modalityIcon: 'fa-building-circle-check',
          updated: 'Preenchida há 7 dias',
          candidates: '1 contratação',
          actions: [
            { id: 'view', icon: 'fa-eye', label: 'Ver' },
            { id: 'duplicate', icon: 'fa-copy', label: 'Duplicar' }
          ]
        }
      ];

      let activeFilter = 'todas';
      let searchQuery = '';

      const $ = (sel) => document.querySelector(sel);
      const toast = $('#toast');
      let toastTimer;

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderFilters() {
        $('#filtersRow').innerHTML = filters.map((f) => `
          <button type="button" class="filter-chip${f.id === activeFilter ? ' active' : ''}"
            data-filter="${f.id}">${escapeHtml(f.label)}</button>
        `).join('');
      }

      function renderKpis() {
        $('#kpiGrid').innerHTML = kpis.map((k) => `
          <div class="kpi-card ${k.color}">
            <div class="kpi-icon"><i class="fa-solid ${k.icon}"></i></div>
            <div class="kpi-label">${escapeHtml(k.label)}</div>
            <div class="kpi-value">${k.value}</div>
          </div>
        `).join('');
      }

      function filterVacancies() {
        const q = searchQuery.toLowerCase().trim();
        return vacancies.filter((v) => {
          if (activeFilter !== 'todas' && v.status !== activeFilter) return false;
          if (!q) return true;

          const haystack = [
            v.title, v.department, v.location, v.modality, v.statusLabel
          ].join(' ').toLowerCase();

          return haystack.includes(q);
        });
      }

      function renderVacancies() {
        const list = filterVacancies();
        const container = $('#vacancyList');
        const empty = $('#emptyState');

        container.innerHTML = list.map((v) => `
          <article class="vacancy-card" data-id="${v.id}" data-title="${escapeHtml(v.title)}" data-status="${v.status}"${v.status === 'publicada' ? ' data-route="rh-vaga-detalhe"' : ''}>
            <div class="vacancy-top">
              <h2 class="vacancy-title">${escapeHtml(v.title)}</h2>
              <span class="status-badge ${v.status}">${escapeHtml(v.statusLabel)}</span>
            </div>
            <div class="vacancy-meta">
              <span><i class="fa-solid fa-sitemap"></i>${escapeHtml(v.department)}</span>
              <span><i class="fa-solid fa-location-dot"></i>${escapeHtml(v.location)}</span>
              <span><i class="fa-solid ${v.modalityIcon}"></i>${escapeHtml(v.modality)}</span>
            </div>
            <div class="vacancy-stats">
              <span><i class="fa-regular fa-clock"></i>${escapeHtml(v.updated)}</span>
              <span><i class="fa-solid fa-user-group"></i>${escapeHtml(v.candidates)}</span>
            </div>
            <div class="vacancy-actions">
              ${v.actions.map((a) => `
                <button type="button" class="action-btn" data-action="${a.id}" data-vacancy="${v.id}">
                  <i class="fa-solid ${a.icon}"></i>
                  ${escapeHtml(a.label)}
                </button>
              `).join('')}
              <button type="button" class="action-btn more" data-action="more" data-vacancy="${v.id}" aria-label="Mais opções">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>
            </div>
          </article>
        `).join('');

        empty.classList.toggle('show', list.length === 0);
      }

      function updateClock() {
        const now = new Date();
        $('#statusTime').textContent =
          `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      }

      const actionMessages = {
        edit: 'Editar vaga',
        duplicate: 'Duplicar vaga',
        pause: 'Vaga pausada',
        play: 'Vaga retomada',
        view: 'Visualizar vaga',
        more: 'Mais opções'
      };

      function bindEvents() {
        $('#btnNotifications').addEventListener('click', () => showToast('8 notificações não lidas'));
        $('#btnFilters').addEventListener('click', () => showToast('Filtros avançados'));

        $('#filtersRow').addEventListener('click', (e) => {
          const chip = e.target.closest('.filter-chip');
          if (!chip) return;
          activeFilter = chip.dataset.filter;
          renderFilters();
          renderVacancies();
        });

        $('#searchInput').addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderVacancies();
        });

        $('#vacancyList').addEventListener('click', (e) => {
          const btn = e.target.closest('.action-btn');
          if (btn) {
            e.stopPropagation();
            const vacancy = vacancies.find((v) => v.id === Number(btn.dataset.vacancy));
            const action = btn.dataset.action;
            if (action === 'view') {
              window.location.href = 'detalhe-vaga-publicada-mobile.html';
              return;
            }
            showToast(`${actionMessages[action] || action}: ${vacancy?.title || ''}`);
            return;
          }

          const card = e.target.closest('.vacancy-card');
          if (card && card.dataset.status === 'publicada') return;
          if (card) showToast(`Detalhes: ${card.dataset.title}`);
        });

      }

      renderFilters();
      renderKpis();
      renderVacancies();
      updateClock();
      bindEvents();
      setInterval(updateClock, 60000);
    })();
  </script>
  <script type="module">
    import { initPage } from './js/nav.js';
    initPage('rh-vagas');
  </script>
</body>
</html>
