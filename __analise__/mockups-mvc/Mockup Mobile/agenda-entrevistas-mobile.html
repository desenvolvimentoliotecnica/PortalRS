<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Talent RH — Agenda de entrevistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --brand: #005691;
      --brand-soft: #e8f2fa;
      --accent: #7c3aed;
      --accent-soft: #f0e8fd;
      --teal: #0d9488;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2b3c;
      --muted: #6c7a89;
      --muted-light: #9aa5b1;
      --border: #e8ecf0;
      --green: #1a9e5c;
      --green-soft: #e6f7ee;
      --orange: #e67e22;
      --orange-soft: #fef3e6;
      --red: #d93025;
      --red-soft: #fdecea;
      --blue: #2b7fd4;
      --blue-soft: #e3f0fb;
      --purple: #7c3aed;
      --purple-soft: #f0e8fd;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0, 40, 80, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bottom-nav-h: 64px;
      --actions-h: 68px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      background: var(--card);
    }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-icons .signal { letter-spacing: 1px; font-size: 11px; }
    .battery {
      width: 24px; height: 11px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 2px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px; top: 2px;
      width: 2px; height: 5px;
      background: var(--text);
      border-radius: 0 1px 1px 0;
    }
    .battery .level {
      position: absolute;
      inset: 1.5px;
      right: 30%;
      background: var(--text);
      border-radius: 1px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 10px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .btn-back {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .top-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .top-brand svg { width: 26px; height: 26px; }
    .top-brand span { font-size: 15px; font-weight: 700; color: var(--brand); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .btn-icon {
      position: relative;
      width: 34px; height: 34px;
      border: none; background: transparent;
      color: var(--accent);
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .badge-count {
      position: absolute;
      top: 0; right: -2px;
      min-width: 15px; height: 15px;
      padding: 0 4px;
      background: #e53935;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-header {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .page-header {
      padding: 12px 16px 10px;
      background: var(--card);
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .page-subtitle { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

    .controls-panel {
      padding: 0 16px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .view-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .view-btn.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: var(--shadow);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .week-select {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
    }
    .week-select i { color: var(--teal); font-size: 13px; }
    .date-range {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .date-range i { color: var(--muted-light); font-size: 11px; }
    .filter-more {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .kpi-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .kpi-strip::-webkit-scrollbar { display: none; }
    .kpi-card {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .kpi-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .kpi-icon {
      width: 24px; height: 24px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
    }
    .kpi-card.blue .kpi-icon { background: var(--blue-soft); color: var(--blue); }
    .kpi-card.purple .kpi-icon { background: var(--purple-soft); color: var(--purple); }
    .kpi-card.orange .kpi-icon { background: var(--orange-soft); color: var(--orange); }
    .kpi-label { font-size: 10px; color: var(--muted); }
    .kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .kpi-card.blue .kpi-value { color: var(--blue); }
    .kpi-card.purple .kpi-value { color: var(--purple); }
    .kpi-card.orange .kpi-value { color: var(--orange); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      padding-bottom: calc(var(--bottom-nav-h) + var(--actions-h) + 16px + var(--safe-bottom));
    }

    .interview-list { display: flex; flex-direction: column; gap: 10px; }

    .iv-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      cursor: pointer;
    }
    .iv-card:active { opacity: 0.95; }

    .iv-avatar-wrap { position: relative; flex-shrink: 0; }
    .iv-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .iv-dot {
      position: absolute;
      bottom: 0; right: 0;
      width: 11px; height: 11px;
      border-radius: 50%;
      border: 2px solid var(--card);
    }
    .iv-dot.green { background: var(--green); }
    .iv-dot.orange { background: var(--orange); }

    .iv-body { min-width: 0; }
    .iv-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .iv-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.25; }
    .iv-role { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .iv-status {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .iv-status.confirmed { background: var(--green-soft); color: var(--green); }
    .iv-status.pending { background: var(--orange-soft); color: var(--orange); }
    .iv-status.reschedule { background: var(--red-soft); color: var(--red); }

    .iv-details { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .iv-detail {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .iv-detail i { width: 12px; font-size: 10px; color: var(--muted-light); text-align: center; }
    .iv-interviewer { font-size: 11px; color: var(--muted); }
    .iv-interviewer a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }
    .iv-stage {
      display: inline-block;
      padding: 2px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    .iv-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }
    .iv-action-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .iv-action-btn:active { background: var(--bg); }

    .iv-chevron {
      grid-row: 1 / span 2;
      grid-column: 3;
      align-self: center;
      color: var(--muted-light);
      font-size: 12px;
      padding-left: 2px;
    }

    .calendar-placeholder {
      display: none;
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .calendar-placeholder.show { display: block; }
    .calendar-placeholder i {
      font-size: 40px;
      color: var(--accent);
      opacity: 0.4;
      margin-bottom: 12px;
      display: block;
    }

    .sticky-actions {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      padding: 10px 16px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 8px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      line-height: 1.2;
    }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }
    .btn-outline {
      background: var(--card);
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }
    .btn:active { transform: scale(0.98); opacity: 0.92; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--bottom-nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted-light);
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 56px;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); }

    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26, 43, 60, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    @media (min-width: 431px) {
      body { padding: 20px 0; align-items: flex-start; }
      .phone { min-height: calc(100dvh - 40px); border-radius: 24px; overflow: hidden; }
    }
  </style>
</head>
<body>
  <div class="phone" id="app">
    <div class="status-bar" aria-hidden="true">
      <span id="statusTime">9:41</span>
      <div class="status-icons">
        <span class="signal">●●●●</span>
        <i class="fa-solid fa-wifi"></i>
        <div class="battery"><div class="level"></div></div>
      </div>
    </div>

    <div class="top-bar">
      <a href="perfil-candidato-mobile.html" class="btn-back" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="top-brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" fill="#005691"/>
          <path d="M12 10H20V12H17V22H15V12H12V10Z" fill="white"/>
        </svg>
        <span>Talent RH</span>
      </div>
      <div class="top-actions">
        <button class="btn-icon" id="btnNotifications" aria-label="Notificações">
          <i class="fa-regular fa-bell"></i>
          <span class="badge-count">8</span>
        </button>
        <img class="avatar-header" src="https://i.pravatar.cc/80?img=32" alt="Usuário" />
      </div>
    </div>

    <div class="page-header">
      <h1 class="page-title">Agenda de entrevistas</h1>
      <p class="page-subtitle">Agende, acompanhe e reorganize entrevistas do processo seletivo.</p>
    </div>

    <div class="controls-panel">
      <div class="view-toggle" role="tablist">
        <button type="button" class="view-btn active" data-view="lista" role="tab" aria-selected="true">
          <i class="fa-solid fa-list"></i> Lista
        </button>
        <button type="button" class="view-btn" data-view="calendario" role="tab" aria-selected="false">
          <i class="fa-regular fa-calendar"></i> Calendário
        </button>
      </div>

      <div class="filter-row">
        <button type="button" class="week-select" id="btnWeek">
          <i class="fa-regular fa-calendar"></i>
          Semana atual
          <i class="fa-solid fa-chevron-down" style="font-size:9px;margin-left:auto;color:var(--muted-light)"></i>
        </button>
        <div class="date-range">
          <i class="fa-regular fa-calendar-days"></i>
          20 a 24/05
        </div>
        <button type="button" class="filter-more" id="btnFilterMore" aria-label="Filtros">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>

      <div class="kpi-strip" id="kpiStrip"></div>
    </div>

    <main class="content">
      <div class="interview-list" id="interviewList"></div>
      <div class="calendar-placeholder" id="calendarView">
        <i class="fa-regular fa-calendar"></i>
        <p>Visualização em calendário<br><span style="font-size:12px">em desenvolvimento</span></p>
      </div>
    </main>

    <div class="sticky-actions">
      <button type="button" class="btn btn-accent" id="btnAgendar">
        <i class="fa-solid fa-calendar-plus"></i>
        Agendar entrevista
      </button>
      <button type="button" class="btn btn-outline" id="btnConvites">
        <i class="fa-regular fa-paper-plane"></i>
        Enviar convites
      </button>
    </div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#" class="nav-item" data-nav="inicio"><i class="fa-solid fa-house"></i><span>Início</span></a>
      <a href="#" class="nav-item" data-nav="requisicoes"><i class="fa-solid fa-clipboard-list"></i><span>Requisições</span></a>
      <a href="#" class="nav-item" data-nav="vagas"><i class="fa-solid fa-briefcase"></i><span>Vagas</span></a>
      <a href="#" class="nav-item active" data-nav="candidatos"><i class="fa-solid fa-user-group"></i><span>Candidatos</span></a>
      <a href="#" class="nav-item" data-nav="mais"><i class="fa-solid fa-ellipsis"></i><span>Mais</span></a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const kpis = [
        { color: 'blue', icon: 'fa-calendar-day', label: 'Hoje', value: 4 },
        { color: 'purple', icon: 'fa-calendar-week', label: 'Esta semana', value: 12 },
        { color: 'orange', icon: 'fa-clock', label: 'Pendentes', value: 3 }
      ];

      const interviews = [
        {
          id: 1,
          avatar: 'https://i.pravatar.cc/80?img=47',
          name: 'Juliana Alves',
          role: 'Analista de RH',
          status: 'confirmed',
          statusLabel: 'Confirmada',
          dot: 'green',
          datetime: 'Hoje, 14:00',
          mode: 'online',
          modeLabel: 'Online',
          modeIcon: 'fa-video',
          interviewer: 'Mariana Costa',
          stage: 'Entrevista RH'
        },
        {
          id: 2,
          avatar: 'https://i.pravatar.cc/80?img=12',
          name: 'Bruno Martins',
          role: 'Assistente Administrativo',
          status: 'pending',
          statusLabel: 'Pendente',
          dot: 'orange',
          datetime: 'Amanhã, 10:30',
          mode: 'presential',
          modeLabel: 'Presencial',
          modeIcon: 'fa-location-dot',
          interviewer: 'Carlos Mendes',
          stage: 'Entrevista gestor'
        },
        {
          id: 3,
          avatar: 'https://i.pravatar.cc/80?img=5',
          name: 'Beatriz Lima',
          role: 'Analista de RH Pleno',
          status: 'reschedule',
          statusLabel: 'Reagendar',
          dot: 'orange',
          datetime: 'Qua, 22/05 — 16:00',
          mode: 'online',
          modeLabel: 'Online',
          modeIcon: 'fa-video',
          interviewer: 'Mariana Costa',
          stage: 'Teste técnico'
        },
        {
          id: 4,
          avatar: 'https://i.pravatar.cc/80?img=20',
          name: 'Rafael Costa',
          role: 'Analista de TI',
          status: 'confirmed',
          statusLabel: 'Confirmada',
          dot: 'green',
          datetime: 'Qui, 23/05 — 11:00',
          mode: 'presential',
          modeLabel: 'Presencial',
          modeIcon: 'fa-location-dot',
          interviewer: 'Ana Paula',
          stage: 'Entrevista RH'
        }
      ];

      let currentView = 'lista';

      const $ = (sel) => document.querySelector(sel);
      const toast = $('#toast');
      let toastTimer;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function renderKpis() {
        $('#kpiStrip').innerHTML = kpis.map((k) => `
          <div class="kpi-card ${k.color}">
            <div class="kpi-top">
              <div class="kpi-icon"><i class="fa-solid ${k.icon}"></i></div>
              <span class="kpi-label">${escapeHtml(k.label)}</span>
            </div>
            <div class="kpi-value">${k.value}</div>
          </div>
        `).join('');
      }

      function renderInterviews() {
        $('#interviewList').innerHTML = interviews.map((iv) => `
          <article class="iv-card" data-id="${iv.id}" data-name="${escapeHtml(iv.name)}">
            <div class="iv-avatar-wrap">
              <img class="iv-avatar" src="${iv.avatar}" alt="${escapeHtml(iv.name)}" />
              <span class="iv-dot ${iv.dot}"></span>
            </div>
            <div class="iv-body">
              <div class="iv-top">
                <div>
                  <div class="iv-name">${escapeHtml(iv.name)}</div>
                  <div class="iv-role">${escapeHtml(iv.role)}</div>
                </div>
                <span class="iv-status ${iv.status}">${escapeHtml(iv.statusLabel)}</span>
              </div>
              <div class="iv-details">
                <div class="iv-detail">
                  <i class="fa-regular fa-clock"></i>
                  ${escapeHtml(iv.datetime)}
                </div>
                <div class="iv-detail">
                  <i class="fa-solid ${iv.modeIcon}"></i>
                  ${escapeHtml(iv.modeLabel)}
                </div>
                <div class="iv-interviewer">
                  Entrevistador(a):
                  <a href="#" data-interviewer="${escapeHtml(iv.interviewer)}">${escapeHtml(iv.interviewer)}</a>
                </div>
                <span class="iv-stage">${escapeHtml(iv.stage)}</span>
              </div>
              <div class="iv-actions">
                <button type="button" class="iv-action-btn" data-action="edit" title="Editar">
                  <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button type="button" class="iv-action-btn" data-action="add" title="Adicionar participante">
                  <i class="fa-solid fa-user-plus"></i>
                </button>
                <button type="button" class="iv-action-btn" data-action="send" title="Enviar convite">
                  <i class="fa-regular fa-paper-plane"></i>
                </button>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right iv-chevron"></i>
          </article>
        `).join('');
      }

      function setView(view) {
        currentView = view;
        document.querySelectorAll('.view-btn').forEach((btn) => {
          const active = btn.dataset.view === view;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        $('#interviewList').style.display = view === 'lista' ? 'flex' : 'none';
        $('#calendarView').classList.toggle('show', view === 'calendario');
      }

      function updateClock() {
        const now = new Date();
        $('#statusTime').textContent =
          `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      }

      function bindEvents() {
        $('#btnNotifications').addEventListener('click', () => showToast('8 notificações não lidas'));
        $('#btnWeek').addEventListener('click', () => showToast('Selecionar semana'));
        $('#btnFilterMore').addEventListener('click', () => showToast('Filtros avançados'));
        $('#btnAgendar').addEventListener('click', () => showToast('Agendar nova entrevista'));
        $('#btnConvites').addEventListener('click', () => showToast('Enviar convites pendentes'));

        document.querySelectorAll('.view-btn').forEach((btn) => {
          btn.addEventListener('click', () => setView(btn.dataset.view));
        });

        $('#interviewList').addEventListener('click', (e) => {
          const actionBtn = e.target.closest('.iv-action-btn');
          if (actionBtn) {
            e.stopPropagation();
            const card = actionBtn.closest('.iv-card');
            const actions = { edit: 'Editar', add: 'Adicionar participante', send: 'Enviar convite' };
            showToast(`${actions[actionBtn.dataset.action]}: ${card.dataset.name}`);
            return;
          }
          const link = e.target.closest('[data-interviewer]');
          if (link) {
            e.preventDefault();
            e.stopPropagation();
            showToast(`Perfil: ${link.dataset.interviewer}`);
            return;
          }
          const card = e.target.closest('.iv-card');
          if (card) {
            window.location.href = 'avaliacao-entrevista-mobile.html';
          }
        });

      }

      renderKpis();
      renderInterviews();
      updateClock();
      bindEvents();
      setInterval(updateClock, 60000);
    })();
  </script>
  <script type="module">
    import { initPage } from './js/nav.js';
    initPage('rh-agenda');
  </script>
</body>
</html>
