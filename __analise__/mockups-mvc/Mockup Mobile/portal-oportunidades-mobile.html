<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Talent RH — Encontre sua próxima oportunidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #005691;
      --primary-dark: #004578;
      --primary-soft: #e8f2fa;
      --teal: #0d9488;
      --teal-soft: #e6f5f3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2b3c;
      --muted: #6c7a89;
      --muted-light: #9aa5b1;
      --border: #e8ecf0;
      --green: #1a9e5c;
      --green-soft: #e6f7ee;
      --orange: #e67e22;
      --orange-soft: #fef3e6;
      --purple: #7c3aed;
      --purple-soft: #f0e8fd;
      --blue: #2b7fd4;
      --blue-soft: #e3f0fb;
      --sky: #0891b2;
      --sky-soft: #e0f4f7;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0, 40, 80, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      background: var(--card);
    }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-icons .signal { letter-spacing: 1px; font-size: 11px; }
    .battery {
      width: 24px; height: 11px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 2px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px; top: 2px;
      width: 2px; height: 5px;
      background: var(--text);
      border-radius: 0 1px 1px 0;
    }
    .battery .level {
      position: absolute;
      inset: 1.5px;
      right: 30%;
      background: var(--text);
      border-radius: 1px;
    }

    .pub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .btn-menu {
      width: 40px; height: 40px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-menu:active { background: var(--primary-soft); }

    .hero {
      padding: 16px 16px 12px;
      background: var(--card);
    }
    .hero-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .hero-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .search-wrap { position: relative; }
    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-light);
      font-size: 14px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }
    .search-input::placeholder { color: var(--muted-light); }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 86, 145, 0.1);
      background: var(--card);
    }

    .filters-section {
      padding: 0 16px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .filters-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 10px;
    }
    .filters-row::-webkit-scrollbar { display: none; }
    .filter-dd {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-dd i { font-size: 9px; color: var(--muted-light); }
    .filter-dd:active { background: var(--bg); }
    .btn-filters {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border: 1.5px solid var(--primary);
      border-radius: 20px;
      background: var(--card);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }
    .btn-filters:active { background: var(--primary-soft); }
    .results-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .job-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

    .job-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 14px;
      transition: transform 0.1s;
    }
    .job-card.hidden { display: none; }
    .job-card:active { transform: scale(0.995); }

    .job-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }
    .job-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      color: #fff;
    }
    .job-icon.primary { background: var(--primary); }
    .job-icon.green { background: var(--green); }
    .job-icon.blue { background: var(--blue); }
    .job-icon.purple { background: var(--purple); }

    .job-head { flex: 1; min-width: 0; }
    .job-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }
    .job-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }
    .job-badge {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 600;
      white-space: nowrap;
    }
    .job-badge.nova { background: var(--green-soft); color: var(--green); }
    .job-badge.urgente { background: var(--orange-soft); color: var(--orange); }
    .job-badge.banco { background: var(--sky-soft); color: var(--sky); }
    .job-company {
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 10px;
    }

    .job-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-bottom: 10px;
    }
    .job-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      min-width: 0;
    }
    .job-meta i {
      width: 14px;
      font-size: 10px;
      color: var(--muted-light);
      text-align: center;
      flex-shrink: 0;
    }

    .job-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .job-footer {
      display: flex;
      justify-content: flex-end;
    }
    .btn-ver-vaga {
      padding: 9px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 86, 145, 0.25);
    }
    .btn-ver-vaga:active { transform: scale(0.97); opacity: 0.92; }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }
    .empty-state.show { display: block; }

    .signup-cta {
      background: linear-gradient(180deg, var(--primary-soft) 0%, #f0f7fc 100%);
      border-radius: var(--radius);
      border: 1px solid rgba(0, 86, 145, 0.12);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 8px;
    }
    .signup-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--card);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin: 0 auto 12px;
      box-shadow: var(--shadow);
    }
    .signup-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 14px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
    .signup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-entrar {
      padding: 12px;
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      background: var(--card);
      color: var(--primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-criar {
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 158, 92, 0.3);
    }
    .btn-entrar:active, .btn-criar:active { transform: scale(0.98); opacity: 0.92; }

    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26, 43, 60, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    @media (min-width: 431px) {
      body { padding: 20px 0; align-items: flex-start; }
      .phone { min-height: calc(100dvh - 40px); border-radius: 24px; overflow: hidden; }
    }
  </style>
</head>
<body>
  <div class="phone" id="app">
    <div class="status-bar" aria-hidden="true">
      <span id="statusTime">9:41</span>
      <div class="status-icons">
        <span class="signal">●●●●</span>
        <i class="fa-solid fa-wifi"></i>
        <div class="battery"><div class="level"></div></div>
      </div>
    </div>

    <header class="pub-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" fill="#005691"/>
          <path d="M12 10H20V12H17V22H15V12H12V10Z" fill="white"/>
        </svg>
        <span class="brand-name">Talent RH</span>
      </div>
      <button type="button" class="btn-menu" id="btnMenu" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <div class="hero">
      <h1 class="hero-title">Encontre sua próxima oportunidade</h1>
      <p class="hero-subtitle">Vagas abertas em diversas áreas</p>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="search"
          class="search-input"
          id="searchInput"
          placeholder="Buscar por cargo, palavra-chave ou cidade"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="filters-section">
      <div class="filters-row">
        <button type="button" class="filter-dd" data-filter="area" id="filterArea">
          Área <i class="fa-solid fa-chevron-down"></i>
        </button>
        <button type="button" class="filter-dd" data-filter="unidade" id="filterUnidade">
          Unidade <i class="fa-solid fa-chevron-down"></i>
        </button>
        <button type="button" class="filter-dd" data-filter="modelo" id="filterModelo">
          Modelo de trabalho <i class="fa-solid fa-chevron-down"></i>
        </button>
        <button type="button" class="btn-filters" id="btnFilters">
          <i class="fa-solid fa-sliders"></i>
          Filtros
        </button>
      </div>
      <div class="results-count" id="resultsCount">28 vagas encontradas</div>
    </div>

    <main class="content">
      <div class="job-list" id="jobList"></div>
      <div class="empty-state" id="emptyState">
        <i class="fa-solid fa-briefcase" style="font-size:32px;margin-bottom:12px;opacity:.4"></i>
        <p>Nenhuma vaga encontrada para esta busca.</p>
      </div>

      <section class="signup-cta" aria-labelledby="signup-title">
        <div class="signup-icon" aria-hidden="true"><i class="fa-solid fa-rocket"></i></div>
        <p class="signup-text" id="signup-title">
          Não encontrou a vaga ideal? Cadastre-se e receba oportunidades que combinam com o seu perfil.
        </p>
        <div class="signup-actions">
          <button type="button" class="btn-entrar" id="btnEntrar">Entrar</button>
          <button type="button" class="btn-criar" id="btnCriar">Criar conta</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const jobs = [
        {
          id: 1,
          title: 'Analista de RH',
          badge: 'nova',
          badgeLabel: 'Nova',
          icon: 'fa-building',
          iconColor: 'primary',
          company: 'Liotécnica',
          department: 'Gente & Cultura',
          location: 'São Paulo - SP',
          model: 'Híbrido',
          salary: 'R$ 4.500 a R$ 5.500',
          desc: 'Atue no recrutamento e seleção, triagem de candidatos e apoio aos gestores na formação de equipes de alta performance.',
          tags: ['rh', 'sp', 'hibrido']
        },
        {
          id: 2,
          title: 'Assistente de Produção',
          badge: 'urgente',
          badgeLabel: 'Urgente',
          icon: 'fa-industry',
          iconColor: 'green',
          company: 'Liotécnica',
          department: 'Produção',
          location: 'Campinas - SP',
          model: 'Presencial',
          salary: 'A combinar',
          desc: 'Apoio operacional na linha de produção, controle de qualidade e organização do chão de fábrica.',
          tags: ['producao', 'campinas', 'presencial']
        },
        {
          id: 3,
          title: 'Desenvolvedor .NET',
          badge: 'nova',
          badgeLabel: 'Nova',
          icon: 'fa-code',
          iconColor: 'blue',
          company: 'Liotécnica',
          department: 'Tecnologia da Informação',
          location: 'São Paulo - SP',
          model: 'Híbrido',
          salary: 'R$ 7.000 a R$ 9.000',
          desc: 'Desenvolvimento de APIs e sistemas internos com .NET, integração com ERP e suporte às squads de produto.',
          tags: ['ti', 'sp', 'hibrido', 'dotnet']
        },
        {
          id: 4,
          title: 'Analista de Qualidade',
          badge: 'banco',
          badgeLabel: 'Banco de talentos',
          icon: 'fa-star',
          iconColor: 'purple',
          company: 'Liotécnica',
          department: 'Qualidade',
          location: 'Joinville - SC',
          model: 'Presencial',
          salary: 'R$ 5.000 a R$ 6.000',
          desc: 'Garantia da qualidade dos processos produtivos, auditorias internas e melhoria contínua.',
          tags: ['qualidade', 'joinville', 'presencial']
        }
      ];

      const filterOptions = {
        area: ['Todas', 'Gente & Cultura', 'Produção', 'TI', 'Qualidade'],
        unidade: ['Todas', 'Matriz - SP', 'Campinas', 'Joinville'],
        modelo: ['Todos', 'Híbrido', 'Presencial', 'Remoto']
      };
      const filterIdx = { area: 0, unidade: 0, modelo: 0 };

      let searchQuery = '';

      const $ = (sel) => document.querySelector(sel);
      const toast = $('#toast');
      let toastTimer;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function filterJobs() {
        const q = searchQuery.toLowerCase().trim();
        return jobs.filter((j) => {
          if (!q) return true;
          const haystack = [
            j.title, j.company, j.department, j.location,
            j.model, j.salary, j.desc, j.badgeLabel
          ].join(' ').toLowerCase();
          return haystack.includes(q);
        });
      }

      function renderJobs() {
        const list = filterJobs();
        $('#jobList').innerHTML = list.map((j) => `
          <article class="job-card" data-id="${j.id}" data-title="${escapeHtml(j.title)}">
            <div class="job-top">
              <div class="job-icon ${j.iconColor}"><i class="fa-solid ${j.icon}"></i></div>
              <div class="job-head">
                <div class="job-title-row">
                  <h2 class="job-title">${escapeHtml(j.title)}</h2>
                  <span class="job-badge ${j.badge}">${escapeHtml(j.badgeLabel)}</span>
                </div>
                <div class="job-company">${escapeHtml(j.company)}</div>
              </div>
            </div>
            <div class="job-meta">
              <span><i class="fa-solid fa-sitemap"></i>${escapeHtml(j.department)}</span>
              <span><i class="fa-solid fa-location-dot"></i>${escapeHtml(j.location)}</span>
              <span><i class="fa-solid fa-laptop-house"></i>${escapeHtml(j.model)}</span>
              <span><i class="fa-solid fa-circle-dollar-to-slot"></i>${escapeHtml(j.salary)}</span>
            </div>
            <p class="job-desc">${escapeHtml(j.desc)}</p>
            <div class="job-footer">
              <button type="button" class="btn-ver-vaga" data-job="${j.id}" data-href="portal-detalhe-vaga-mobile.html">Ver vaga</button>
            </div>
          </article>
        `).join('');

        const count = list.length;
        $('#resultsCount').textContent =
          count === 1 ? '1 vaga encontrada' : `${count} vagas encontradas`;
        $('#emptyState').classList.toggle('show', count === 0);
      }

      function updateFilterButton(type) {
        const opts = filterOptions[type];
        const idx = filterIdx[type];
        const labels = { area: 'Área', unidade: 'Unidade', modelo: 'Modelo de trabalho' };
        const val = opts[idx];
        const display = idx === 0 ? labels[type] : val;
        const btn = document.querySelector(`[data-filter="${type}"]`);
        if (btn) {
          btn.innerHTML = `${escapeHtml(display)} <i class="fa-solid fa-chevron-down"></i>`;
        }
      }

      function updateClock() {
        const now = new Date();
        $('#statusTime').textContent =
          `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      }

      function bindEvents() {
        $('#btnMenu').addEventListener('click', () => showToast('Menu do portal'));
        $('#btnFilters').addEventListener('click', () => showToast('Filtros avançados'));
        $('#btnEntrar').addEventListener('click', () => showToast('Entrar no portal de candidatos'));
        $('#btnCriar').addEventListener('click', () => showToast('Criar conta de candidato'));

        $('#searchInput').addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderJobs();
        });

        ['area', 'unidade', 'modelo'].forEach((type) => {
          document.querySelector(`[data-filter="${type}"]`).addEventListener('click', () => {
            filterIdx[type] = (filterIdx[type] + 1) % filterOptions[type].length;
            updateFilterButton(type);
            showToast(`${filterOptions[type][filterIdx[type]]}`);
          });
        });

        $('#jobList').addEventListener('click', (e) => {
          const btn = e.target.closest('.btn-ver-vaga');
          if (btn) {
            const href = btn.dataset.href;
            if (href) {
              window.location.href = href;
              return;
            }
            const job = jobs.find((j) => j.id === Number(btn.dataset.job));
            showToast(job ? `Ver vaga: ${job.title}` : 'Ver vaga');
            return;
          }
          const card = e.target.closest('.job-card');
          if (card) showToast(`Detalhes: ${card.dataset.title}`);
        });
      }

      renderJobs();
      updateClock();
      bindEvents();
      setInterval(updateClock, 60000);
    })();
  </script>
</body>
</html>
