trigger:
  - develop

pool:
  vmImage: ubuntu-latest

variables:
  package_name: 'deploy-package.tar.gz'
  artifact_name: 'drop'

steps:
  - task: Bash@3
    displayName: "Compactar projeto para release"
    inputs:
      targetType: "inline"
      script: |
        set -eo pipefail
        ROOT_DIR="."
        if [ -d "Voltage.RenderRH" ]; then
          ROOT_DIR="Voltage.RenderRH"
        fi
        PACKAGE_NAME="deploy-package.tar.gz"
        echo "Build.SourcesDirectory = $(Build.SourcesDirectory)"
        cd "$(Build.SourcesDirectory)"
        echo "Root: ${ROOT_DIR}"
        echo "Pacote: ${PACKAGE_NAME}"
        echo "Conteúdo do diretório:"
        ls -la
        echo "Criando tar..."
        tar -czf "${PACKAGE_NAME}" \
          -C "${ROOT_DIR}" . || { echo "ERRO: tar falhou com código $?"; exit 1; }
        test -f "${PACKAGE_NAME}" || { echo "ERRO: arquivo não criado"; exit 1; }
        ls -lh "${PACKAGE_NAME}"
        echo "Pacote validado com sucesso"

  - task: CopyFiles@2
    displayName: "Organizar para artefato"
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '$(package_name)'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/$(artifact_name)'

  - task: PublishBuildArtifacts@1
    displayName: "Publicar artefato"
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(artifact_name)'
      ArtifactName: '$(artifact_name)'
      publishLocation: 'Container'