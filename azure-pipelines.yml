trigger:
  - develop

pool:
  vmImage: ubuntu-latest

variables:
  remote_path: "/home/ubuntu/voltage-renderrh"
  s3_bucket: "deploy-voltage-renderrh"
  s3_key: "deploy-package.tar.gz"
  package_name: "deploy-package.tar.gz"
  artifact_name: "drop"

steps:
  - task: Bash@3
    displayName: 'Compactar projeto RENDER (WEB + API + AI + Integration)'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        echo "Diretório atual: $(Build.SourcesDirectory)"
        cd "$(Build.SourcesDirectory)"

        if [ -d "RENDER" ]; then
          echo "Incluindo RENDER no tar"
          tar -czf deploy-package.tar.gz RENDER
        elif [ -d "Voltage.RenderRH" ]; then
          echo "Incluindo Voltage.RenderRH no tar"
          tar -czf deploy-package.tar.gz Voltage.RenderRH
        else
          echo "Incluindo raiz no tar"
          tar -czf deploy-package.tar.gz .
        fi

        if [ ! -f deploy-package.tar.gz ]; then
          echo "ERRO: Arquivo não foi criado!"
          exit 1
        fi

        echo "Arquivo gerado:"
        ls -lh deploy-package.tar.gz

        echo "Verificando RHPortal.Api..."
        tar -tzf deploy-package.tar.gz | grep -qE "RHPortal\.Api" || { echo "❌ RHPortal.Api não encontrado"; exit 1; }
        echo "✅ RHPortal.Api no pacote"

        echo "Verificando RHPortal.Ai..."
        tar -tzf deploy-package.tar.gz | grep -qE "RHPortal\.Ai" || { echo "❌ RHPortal.Ai não encontrado"; exit 1; }
        echo "✅ RHPortal.Ai no pacote"

        echo "Verificando LioTecnica.Web.Next..."
        tar -tzf deploy-package.tar.gz | grep -qE "LioTecnica\.Web\.Next" || { echo "❌ LioTecnica.Web.Next não encontrado"; exit 1; }
        echo "✅ LioTecnica.Web.Next no pacote"

        echo "✅ Pacote criado e validado"

  - task: CopyFiles@2
    displayName: 'Organizar para o Artefato'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: 'deploy-package.tar.gz'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'

  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefato'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
      ArtifactName: 'drop'
      publishLocation: 'Container'