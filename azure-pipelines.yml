trigger:
  - develop

pool:
  vmImage: ubuntu-latest

variables:
  package_name: 'deploy-package.tar.gz'
  artifact_name: 'drop'

steps:
  - task: Bash@3
    displayName: "Compactar projeto para release"
    inputs:
      targetType: "inline"
      script: |
        set -euo pipefail

        echo "Build.SourcesDirectory = $(Build.SourcesDirectory)"
        cd "$(Build.SourcesDirectory)"

        if [ -d "Voltage.RenderRH" ]; then
          ROOT_DIR="Voltage.RenderRH"
        else
          ROOT_DIR="."
        fi

        echo "Root detectado: ${ROOT_DIR}"
        echo "Pacote: $(package_name)"

        tar -czf "$(package_name)" \
          --warning=no-file-changed \
          --exclude='.git' \
          --exclude='$(package_name)' \
          --exclude='.vs' \
          --exclude='.vscode' \
          --exclude='.idea' \
          --exclude='**/bin' \
          --exclude='**/obj' \
          --exclude='**/*.log' \
          --exclude='**/.env' \
          -C "${ROOT_DIR}" .

        test -f "$(package_name)" || (echo "ERRO: pacote não foi criado"; exit 1)
        ls -lh "$(package_name)"
        echo "✅ Pacote validado com sucesso"

  - task: CopyFiles@2
    displayName: "Organizar para artefato"
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '$(package_name)'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/$(artifact_name)'

  - task: PublishBuildArtifacts@1
    displayName: "Publicar artefato"
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(artifact_name)'
      ArtifactName: '$(artifact_name)'
      publishLocation: 'Container'